name: Docker build & publish

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context.
        type: string
        default: "."
      file:
        description: Path to the Dockerfile.
        type: string
        default: "Dockerfile"
      image-name:
        description: >-
          Image name (without registry). Required to compute tags and to publish.
          When empty, the workflow only validates the build.
        type: string
        default: ""
      registry:
        description: Registry to publish to when push is true.
        type: string
        default: "ghcr.io"
      tags:
        description: >-
          Extra docker/metadata-action tag rules, one per line. Defaults to branch,
          tag and short-sha tags plus `latest` on the default branch.
        type: string
        default: ""
      platforms:
        description: Platforms to build, comma separated.
        type: string
        default: "linux/amd64"
      build-args:
        description: Build arguments, one per line.
        type: string
        default: ""
      target:
        description: Target build stage to build.
        type: string
        default: ""
      push:
        description: Publish the image to the registry. Never implicit.
        type: boolean
        default: false
      load:
        description: Load the built image onto the runner (single platform only).
        type: boolean
        default: false
      cache:
        description: Use GitHub Actions cache for the build.
        type: boolean
        default: true
    secrets:
      registry-username:
        description: Username for non-GHCR registries when push is true.
        required: false
      registry-password:
        description: Password/token for non-GHCR registries when push is true.
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inputs
        shell: bash
        env:
          PUSH: ${{ inputs.push }}
          IMAGE_NAME: ${{ inputs.image-name }}
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_USERNAME: ${{ secrets.registry-username }}
          REGISTRY_PASSWORD: ${{ secrets.registry-password }}
        run: |
          set -euo pipefail
          if [ "$PUSH" = "true" ] && [ -z "$IMAGE_NAME" ]; then
            echo "::error::push is enabled but image-name is empty. Publish is never implicit." >&2
            exit 1
          fi
          if [ "$PUSH" = "true" ] \
             && [ "$REGISTRY" != "ghcr.io" ] \
             && { [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_PASSWORD" ]; }; then
            echo "::error::push to $REGISTRY requires registry-username and registry-password secrets." >&2
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        if: ${{ inputs.image-name != '' }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ format('{0}/{1}', inputs.registry, inputs.image-name) }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            ${{ inputs.tags }}

      - name: Log in to registry
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry == 'ghcr.io' && github.actor || secrets.registry-username }}
          password: ${{ inputs.registry == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.registry-password }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: ${{ inputs.push }}
          load: ${{ inputs.load }}
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build-args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ inputs.cache && 'type=gha' || '' }}
          cache-to: ${{ inputs.cache && 'type=gha,mode=max' || '' }}
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint workflows and actions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint workflows and composite actions
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          python3 -m pip install --quiet pyyaml
          bash tests/lint.sh

  unit:
    name: Script unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run script tests
        run: bash tests/run.sh

  action:
    name: Integration - government-check action
    needs: [lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run CodeGouvAOR Government Check
        id: check
        uses: $/actions/government-check
        with:
          readme-required: true
          license-required: true
          secret-scan: true

      - name: Verify action outputs
        shell: bash
        run: |
          set -euo pipefail
          echo "status=${{ steps.check.outputs.status }}"
          echo "project-type=${{ steps.check.outputs.project-type }}"
          echo "checks-passed=${{ steps.check.outputs.checks-passed }}"
          test "${{ steps.check.outputs.status }}" = "pass"

  marketplace:
    name: Marketplace detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Detect and validate Marketplace readiness
        id: detect
        shell: bash
        run: bash scripts/marketplace-detect.sh

      - name: Report
        shell: bash
        run: |
          echo "marketplace-detected=${{ steps.detect.outputs.marketplace-detected }}"
          echo "release=${{ steps.detect.outputs.release }}"

  government:
    name: Self-hosted government CI (dogfood)
    needs: [lint]
    permissions:
      contents: read
    uses: ./.github/workflows/government.yml
    with:
      project-type: none
      secret-scan: true

  node:
    name: Integration - Node.js workflow
    needs: [lint]
    permissions:
      contents: read
    uses: ./.github/workflows/node.yml
    with:
      node-version: "22"
      package-manager: npm
      working-directory: tests/fixtures/node-app
      frozen-lockfile: true

  go:
    name: Integration - Go workflow
    needs: [lint]
    permissions:
      contents: read
    uses: ./.github/workflows/go.yml
    with:
      go-version: "1.24"
      working-directory: tests/fixtures/go-app

  docker:
    name: Integration - Docker workflow
    needs: [lint]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/docker.yml
    with:
      context: tests/fixtures/docker-app
      file: tests/fixtures/docker-app/Dockerfile
      image-name: codegouvaor/actions-fixture
      push: false
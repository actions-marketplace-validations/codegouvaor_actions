name: CodeGouvAOR Government CI

on:
  workflow_call:
    inputs:
      project-type:
        description: >-
          Force the project type. One of auto, node, go, docker, none.
        type: string
        default: auto
      working-directory:
        description: Directory containing the project, relative to the repository root.
        type: string
        default: "."
      node-version:
        description: Node.js version for the Node.js validation.
        type: string
        default: "22"
      pnpm-version:
        description: pnpm version for the Node.js validation.
        type: string
        default: "10"
      go-version:
        description: Go version for the Go validation (empty = read from go.mod).
        type: string
        default: ""
      readme-required:
        description: Fail when no README is present.
        type: boolean
        default: true
      license-required:
        description: Fail when no license is present.
        type: boolean
        default: true
      secret-scan:
        description: Scan tracked files for exposed secrets.
        type: boolean
        default: true
      fail-on-secret:
        description: Fail when the secret scan reports a match.
        type: boolean
        default: true
      dependency-audit:
        description: Run a dependency vulnerability audit (opt-in).
        type: boolean
        default: false
      audit-level:
        description: Minimum severity that fails a Node.js audit.
        type: string
        default: high
      ads-check:
        description: >-
          Check the react-ads integration when used. One of auto, on, off.
        type: string
        default: auto

permissions:
  contents: read

jobs:
  validate:
    name: Repository and project validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      project-type: ${{ steps.detect.outputs.project-type }}
      is-node: ${{ steps.detect.outputs.is-node }}
      is-go: ${{ steps.detect.outputs.is-go }}
      is-docker: ${{ steps.detect.outputs.is-docker }}
      package-manager: ${{ steps.detect.outputs.package-manager }}
      uses-react-ads: ${{ steps.detect.outputs.uses-react-ads }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CodeGouvAOR government check
        id: detect
        uses: $/actions/government-check
        with:
          working-directory: ${{ inputs.working-directory }}
          project-type: ${{ inputs.project-type }}
          readme-required: ${{ inputs.readme-required }}
          license-required: ${{ inputs.license-required }}
          secret-scan: ${{ inputs.secret-scan }}
          fail-on-secret: ${{ inputs.fail-on-secret }}

  node:
    name: Node.js validation
    needs: validate
    if: ${{ needs.validate.outputs.is-node == 'true' }}
    uses: $/.github/workflows/node.yml
    with:
      node-version: ${{ inputs.node-version }}
      pnpm-version: ${{ inputs.pnpm-version }}
      package-manager: ${{ needs.validate.outputs.package-manager }}
      working-directory: ${{ inputs.working-directory }}

  go:
    name: Go validation
    needs: validate
    if: ${{ needs.validate.outputs.is-go == 'true' }}
    uses: $/.github/workflows/go.yml
    with:
      go-version: ${{ inputs.go-version }}
      working-directory: ${{ inputs.working-directory }}

  docker:
    name: Docker build validation
    needs: validate
    if: ${{ needs.validate.outputs.is-docker == 'true' }}
    uses: $/.github/workflows/docker.yml
    with:
      context: ${{ inputs.working-directory }}
      file: ${{ inputs.working-directory }}/Dockerfile
      push: false

  ads:
    name: react-ads integration check
    needs: validate
    if: ${{ needs.validate.outputs.is-node == 'true' && needs.validate.outputs.uses-react-ads == 'true' && (inputs.ads-check == 'auto' || inputs.ads-check == 'on') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ADS check
        uses: $/actions/ads-check
        with:
          working-directory: ${{ inputs.working-directory }}

  audit:
    name: Dependency vulnerability audit
    needs: validate
    if: ${{ inputs.dependency-audit && needs.validate.outputs.project-type != 'none' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        if: ${{ needs.validate.outputs.is-node == 'true' && needs.validate.outputs.package-manager == 'pnpm' }}
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Set up Node.js
        if: ${{ needs.validate.outputs.is-node == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Set up Go
        if: ${{ needs.validate.outputs.is-go == 'true' }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && format('{0}/go.mod', inputs.working-directory) || '' }}

      - name: Audit dependencies
        uses: $/actions/government-check
        with:
          working-directory: ${{ inputs.working-directory }}
          project-type: auto
          dependency-audit: true
          audit-level: ${{ inputs.audit-level }}
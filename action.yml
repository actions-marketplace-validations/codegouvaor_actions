name: CodeGouvAOR Government Check
description: Validate a repository against official CodeGouvAOR repository and government standards.
author: CodeGouvAOR

# This root `action.yml` is the official CodeGouvAOR action published to the
# GitHub Marketplace. GitHub requires a single action metadata file at the
# repository root to be detected and listed on the Marketplace.
#
# The implementation lives in actions/government-check/ so there is a single
# source of truth; this file only forwards inputs/outputs to it. The `$/`
# self-repository reference resolves to this repository at the exact commit or
# tag the caller pinned (e.g. @v1), so the published action always matches the
# release it is invoked from.

branding:
  icon: shield
  color: blue

inputs:
  working-directory:
    description: Directory to inspect, relative to the repository root.
    required: false
    default: "."
  project-type:
    description: >-
      Force the detected project type. One of: auto, node, go, docker, none.
      With "auto" every applicable type is enabled at once.
    required: false
    default: "auto"
  readme-required:
    description: Fail when no README file is found.
    required: false
    default: "true"
  license-required:
    description: Fail when no license file is found.
    required: false
    default: "true"
  gitignore-required:
    description: Fail when no .gitignore file is found.
    required: false
    default: "false"
  codeowners-required:
    description: Fail when no CODEOWNERS file is found.
    required: false
    default: "false"
  publiccode-required:
    description: Fail when no publiccode.yml file is found.
    required: false
    default: "false"
  dependabot-required:
    description: Fail when no .github/dependabot.yml file is found.
    required: false
    default: "false"
  secret-scan:
    description: Scan tracked files for well-known secret patterns.
    required: false
    default: "true"
  fail-on-secret:
    description: Fail when the secret scan reports a match.
    required: false
    default: "true"
  fail-on-warning:
    description: Also fail when warnings are reported.
    required: false
    default: "false"
  max-file-size-mb:
    description: Warn for tracked files larger than this size (MiB).
    required: false
    default: "10"
  dependency-audit:
    description: >-
      Run a dependency vulnerability audit for the detected project type. The
      required toolchain (pnpm/npm or Go) must already be available on the runner.
    required: false
    default: "false"
  audit-level:
    description: Minimum severity that fails a Node.js audit (low, moderate, high, critical).
    required: false
    default: "high"
  exclude:
    description: >-
      Newline-separated extra paths (glob patterns accepted by `case`) to exclude
      from the secret scan.
    required: false
    default: ""

outputs:
  status:
    description: "'pass' when all checks passed, 'fail' otherwise."
    value: ${{ steps.check.outputs.status }}
  errors:
    description: Number of failed checks.
    value: ${{ steps.check.outputs.errors }}
  warnings:
    description: Number of warnings reported.
    value: ${{ steps.check.outputs.warnings }}
  checks-passed:
    description: Number of checks that passed.
    value: ${{ steps.check.outputs.checks-passed }}
  has-readme:
    description: "'true' when a README file exists."
    value: ${{ steps.check.outputs.has-readme }}
  has-license:
    description: "'true' when a license file exists."
    value: ${{ steps.check.outputs.has-license }}
  has-gitignore:
    description: "'true' when a .gitignore file exists."
    value: ${{ steps.check.outputs.has-gitignore }}
  has-codeowners:
    description: "'true' when a CODEOWNERS file exists."
    value: ${{ steps.check.outputs.has-codeowners }}
  has-publiccode:
    description: "'true' when a publiccode.yml file exists."
    value: ${{ steps.check.outputs.has-publiccode }}
  secrets-found:
    description: "'true' when the secret scan reported at least one match."
    value: ${{ steps.check.outputs.secrets-found }}
  project-type:
    description: Resolved project type (node, go, docker, mixed or none).
    value: ${{ steps.check.outputs.project-type }}
  detected-types:
    description: Comma-separated list of detected types (for example "node,docker").
    value: ${{ steps.check.outputs.detected-types }}
  is-node:
    description: "'true' when the Node.js validation should run."
    value: ${{ steps.check.outputs.is-node }}
  is-go:
    description: "'true' when the Go validation should run."
    value: ${{ steps.check.outputs.is-go }}
  is-docker:
    description: "'true' when the Docker validation should run."
    value: ${{ steps.check.outputs.is-docker }}
  package-manager:
    description: Node.js package manager (pnpm, npm or yarn).
    value: ${{ steps.check.outputs.package-manager }}
  uses-react-ads:
    description: "'true' when @codegouvaor/react-ads is declared as a dependency."
    value: ${{ steps.check.outputs.uses-react-ads }}

runs:
  using: composite
  steps:
    - id: check
      uses: $/actions/government-check
      with:
        working-directory: ${{ inputs.working-directory }}
        project-type: ${{ inputs.project-type }}
        readme-required: ${{ inputs.readme-required }}
        license-required: ${{ inputs.license-required }}
        gitignore-required: ${{ inputs.gitignore-required }}
        codeowners-required: ${{ inputs.codeowners-required }}
        publiccode-required: ${{ inputs.publiccode-required }}
        dependabot-required: ${{ inputs.dependabot-required }}
        secret-scan: ${{ inputs.secret-scan }}
        fail-on-secret: ${{ inputs.fail-on-secret }}
        fail-on-warning: ${{ inputs.fail-on-warning }}
        max-file-size-mb: ${{ inputs.max-file-size-mb }}
        dependency-audit: ${{ inputs.dependency-audit }}
        audit-level: ${{ inputs.audit-level }}
        exclude: ${{ inputs.exclude }}